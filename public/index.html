<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kresleni</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="crosshair"></div>
    <div id="colorSelectionCrosshair"></div>
    <div id="panel">
        <div id="colorPanel">
            <button value=""></button>
            <button value=""></button>
            <button value=""></button>
            <button value=""></button>
            <button value=""></button>

        <div id="userColorPanel">
            <button value=""></button>
            <button value=""></button>
            <button value=""></button>
            <button value=""></button>
            <button value=""></button>
            <button value=""></button>            
        </div>
    </div>
    <div id="colorPickerWindow">
        <canvas id="colorPickerMain" style="z-index: 2; position: absolute; top: 15%; left: 15%;pointer-events: all;"></canvas>
        <input type="range" value="0" min="0" max="360" id="hueSlider">
        <span id="colorPreview"></span>
        <div id="rgbValuePreview">
            <div>
            <h6 style="top: -52px; font-size: 15px;">Red</h6>
            <input type="number" id="redValue" min="0" max="255" value="0">
            </div>
            <div>
            <h6 style="top: 2px; font-size: 15px;">Green</h6>
            <input type="number" id="greenValue" min="0" max="255" value="0">
            </div>
            <div>
            <h6 style="top: 59px; font-size: 15px;">Blue</h6>
            <input type="number" id="blueValue" min="0" max="255" value="0">
            </div>
            <h6 style="top: 115px; font-size: 15px;">Hex</h6>
            <div id="hexInput">
                <input type="text" id="hexCode" value="#000000" maxlength="7">
            </div>
        </div>
        <div id="gridForBtnColorPicker">
            <button id="confirmButton" value="1">OK</button>
            <button id="cancelButton" value="0">cancel</button>
        </div>
    </div>
    <div id="toolWheel">
        <button value="pencil" id="pencil"><img src="icons/pencil.png" style="width: 50%; left: 30%; position: absolute; top: 30%;"></button>
        <button value="pen" id="pen"><img src="icons/pen.png" style="width: 50%; left: 10%; position: absolute; top: 40%;"></button>
        <button value="eraser" id="eraser"><img src="icons/eraser.png" style="width: 40%; left: 40%; position: absolute; top: 20%;"></button>
        <button value="fill" id="fill"><img src="icons/paint-bucket.png" style="width: 50%; left: 12.5%; position: absolute; top: 12.5%;"></button>
    </div>
    <canvas id="canvas" style="border: 3px solid black;"></canvas>
    <script src="js/declaration.js"></script>
    <script src="js/eventListeners.js"></script>
    <script src="js/converters.js"></script>
    <script src="js/colorPicker.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
